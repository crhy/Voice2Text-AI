name: Test and build Flatpak

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test tools
        run: python -m pip install --upgrade pytest ruff
      - name: Compile source
        run: python -m compileall -q voice2text voice2text_ai.py
      - name: Lint
        run: ruff check voice2text tests voice2text_ai.py
      - name: Unit tests
        run: python -m pytest -q

  flatpak:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      # python3-requirements-flatpak.json is committed. To regenerate it after
      # changing packaging/flatpak/requirements.txt, run flatpak-pip-generator
      # with org.gnome.Sdk//48 and the same --prefer-wheels/--wheel-arches args,
      # then merge requests, urllib3 and charset_normalizer into the
      # python3-faster-whisper module (flatpak-pip-generator splits them out when
      # huggingface-hub is pinned below the latest version).
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Voice2Text-AI.flatpak
          manifest-path: io.github.crhy.voice2textai.yml
          cache-key: flatpak-builder-${{ github.sha }}
          mirror-screenshots-url: https://dl.flathub.org/media
      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: Voice2Text-AI-Flatpak
          path: Voice2Text-AI.flatpak

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Voice2Text-AI-Flatpak
      - uses: softprops/action-gh-release@v2
        with:
          name: Voice2Text AI ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: Voice2Text-AI.flatpak
