name: Test and build Flatpak

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test tools
        run: python -m pip install --upgrade pytest ruff
      - name: Compile source
        run: python -m compileall -q voice2text voice2text_ai.py
      - name: Lint
        run: ruff check voice2text tests voice2text_ai.py
      - name: Unit tests
        run: python -m pytest -q

  flatpak:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      # python3-requirements-flatpak.json is committed. To regenerate it after
      # changing packaging/flatpak/requirements.txt, run flatpak-pip-generator
      # with org.gnome.Sdk//50 and the same --prefer-wheels/--wheel-arches args,
      # then merge requests, urllib3 and charset_normalizer into the
      # python3-faster-whisper module (flatpak-pip-generator splits them out when
      # huggingface-hub is pinned below the latest version).
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: io.github.crhy.voice2textai.yml
          branch: master
          repo-dir: voice2text-repo
          build-bundle: false
          upload-artifact: false
          cache-key: flatpak-builder-${{ github.sha }}
          # Do NOT mirror screenshots to https://dl.flathub.org/media. That
          # option rewrites every screenshot URL in the exported AppStream to
          # Flathub's media CDN, but this application is published to the
          # Spaced Linux `spaced-github` repository rather than to Flathub, so
          # nothing is ever uploaded to those paths. The rewritten URLs
          # returned 404 and SpacedBazaar showed the app with no screenshots
          # at all (crhy/spaced#181). Leaving it unset keeps the raw
          # githubusercontent URLs declared in the metainfo, which resolve.
      - name: Create updateable release bundle
        run: >-
          flatpak build-bundle
          --arch=x86_64
          --repo-url=https://crhy.github.io/spacedbazaar/flatpak-repo/
          --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
          voice2text-repo
          Voice2Text-AI.flatpak
          io.github.crhy.voice2textai
          master
      - name: Verify bundle can be imported by current OSTree
        shell: bash
        run: |
          set -euo pipefail
          probe=$(mktemp -d)
          repo="$probe/repo"
          checkout="$probe/checkout"
          ostree init --repo="$repo" --mode=archive-z2
          flatpak build-import-bundle --no-update-summary "$repo" Voice2Text-AI.flatpak
          ref=app/io.github.crhy.voice2textai/x86_64/master
          ostree --repo="$repo" refs | grep -Fx "$ref"
          ostree --repo="$repo" checkout --user-mode "$ref" "$checkout"
          test -f "$checkout/export/share/metainfo/io.github.crhy.voice2textai.metainfo.xml"
          test -s "$checkout/export/share/icons/hicolor/256x256/apps/io.github.crhy.voice2textai.png"
          flatpak build-update-repo "$repo"
      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: Voice2Text-AI-Flatpak
          path: Voice2Text-AI.flatpak

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Voice2Text-AI-Flatpak
      - uses: softprops/action-gh-release@v2
        with:
          name: Voice2Text AI ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: Voice2Text-AI.flatpak
