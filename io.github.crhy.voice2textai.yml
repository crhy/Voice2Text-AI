id: io.github.crhy.voice2textai
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: voice2text-ai

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri

modules:
  - name: espeak-ng
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/espeak-ng/espeak-ng.git
        tag: 1.52.0
        commit: 4870adfa25b1a32b4361592f1be8a40337c58d6c
    build-commands:
      - ./autogen.sh
      - ./configure --prefix=/app --with-sonic=no --with-mbrola=no --with-pcaudiolib=no
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - make install

  # Generated with flatpak-pip-generator (committed; see requirements.txt note).
  - python3-requirements-flatpak.json

  - name: nvidia-cuda-runtime
    buildsystem: simple
    only-arches:
      - x86_64
    sources:
      - type: file
        url: https://developer.download.nvidia.com/compute/cuda/redist/libcublas/linux-x86_64/libcublas-linux-x86_64-12.8.5.5-archive.tar.xz
        sha256: f732baf6e55de1844f9bea6646ceae13f30b10592f87b12406bf4713b7f67521
      - type: file
        url: https://developer.download.nvidia.com/compute/cuda/redist/cuda_cudart/linux-x86_64/cuda_cudart-linux-x86_64-12.8.90-archive.tar.xz
        sha256: 8d566b5fe745c46842dc16945cf36686227536decd2302c372be86da37faca68
    build-commands:
      - mkdir -p /app/lib/cuda
      - tar -xJf libcublas-*.tar.xz --no-same-owner
      - tar -xJf cuda_cudart-*.tar.xz --no-same-owner
      - install -Dm755 libcublas-*-archive/lib/libcublas.so.12.8.5.5 /app/lib/cuda/
      - install -Dm755 libcublas-*-archive/lib/libcublasLt.so.12.8.5.5 /app/lib/cuda/
      - install -Dm755 cuda_cudart-*-archive/lib/libcudart.so.12.8.90 /app/lib/cuda/
      - ln -sf libcublas.so.12.8.5.5 /app/lib/cuda/libcublas.so.12
      - ln -sf libcublasLt.so.12.8.5.5 /app/lib/cuda/libcublasLt.so.12
      - ln -sf libcudart.so.12.8.90 /app/lib/cuda/libcudart.so.12

  - name: voice2text-ai
    buildsystem: simple
    sources:
      - type: dir
        path: .
    build-commands:
      - install -d /app/lib/voice2text-ai/voice2text
      - install -Dm755 voice2text_ai.py /app/lib/voice2text-ai/voice2text_ai.py
      - install -Dm644 voice2text/*.py /app/lib/voice2text-ai/voice2text/
      - install -Dm755 packaging/flatpak/voice2text-ai /app/bin/voice2text-ai
      - install -Dm644 io.github.crhy.voice2textai.desktop /app/share/applications/io.github.crhy.voice2textai.desktop
      - install -Dm644 io.github.crhy.voice2textai.metainfo.xml /app/share/metainfo/io.github.crhy.voice2textai.metainfo.xml
      - install -Dm644 icons/io.github.crhy.voice2textai.png /app/share/icons/hicolor/256x256/apps/io.github.crhy.voice2textai.png
