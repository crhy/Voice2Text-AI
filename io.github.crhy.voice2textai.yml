id: io.github.crhy.voice2textai
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.10'
command: voice2text-ai

build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: '1'

cleanup-commands:
  - /app/cleanup-BaseApp.sh

finish-args:
  # GUI
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland

  # Audio
  - --socket=pulseaudio

  # Network is needed for Edge TTS, Ollama API, and model downloads.
  - --share=network

  # Let the app access normal user documents if needed later.
  - --filesystem=xdg-documents

modules:
  - name: portaudio
    buildsystem: cmake-ninja
    config-opts:
      - -DPA_BUILD_SHARED=ON
      - -DPA_BUILD_STATIC=OFF
      - -DPA_ENABLE_JACK=OFF
      - -DPA_ENABLE_ALSA=ON
      - -DPA_ENABLE_PULSEAUDIO=ON
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/PortAudio/portaudio.git
        tag: v19.7.0

  - name: espeak-ng
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/espeak-ng/espeak-ng.git
        tag: 1.52.0
    build-commands:
      - ./autogen.sh
      - ./configure --prefix=/app --with-sonic=no --with-mbrola=no --with-pcaudiolib=no
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - make install

  - python3-requirements-flatpak.json

  - name: voice2text-ai
    buildsystem: simple
    sources:
      - type: dir
        path: .
    build-commands:
      - install -Dm755 packaging/flatpak/voice2text-ai /app/bin/voice2text-ai
      - install -Dm644 qt_app.py /app/share/voice2text-ai/qt_app.py
      - install -Dm644 config.example.json /app/share/voice2text-ai/config.example.json
      - install -Dm644 voice_config.example.json /app/share/voice2text-ai/voice_config.example.json
      - install -Dm644 io.github.crhy.voice2textai.desktop /app/share/applications/io.github.crhy.voice2textai.desktop
      - install -Dm644 io.github.crhy.voice2textai.metainfo.xml /app/share/metainfo/io.github.crhy.voice2textai.metainfo.xml
      - install -Dm644 icons/io.github.crhy.voice2textai.png /app/share/icons/hicolor/256x256/apps/io.github.crhy.voice2textai.png
