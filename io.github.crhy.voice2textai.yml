id: io.github.crhy.voice2textai
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: voice2text-ai

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri

modules:
  - name: espeak-ng
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/espeak-ng/espeak-ng.git
        tag: 1.52.0
        commit: 4870adfa25b1a32b4361592f1be8a40337c58d6c
    build-commands:
      - ./autogen.sh
      - ./configure --prefix=/app --with-sonic=no --with-mbrola=no --with-pcaudiolib=no
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - make install

  # Generated with flatpak-pip-generator from packaging/flatpak/requirements.txt.
  - python3-requirements-flatpak.json

  - name: voice2text-ai
    buildsystem: simple
    sources:
      - type: dir
        path: .
    build-commands:
      - install -d /app/lib/voice2text-ai/voice2text
      - install -Dm755 voice2text_ai.py /app/lib/voice2text-ai/voice2text_ai.py
      - install -Dm644 voice2text/*.py /app/lib/voice2text-ai/voice2text/
      - install -Dm755 packaging/flatpak/voice2text-ai /app/bin/voice2text-ai
      - install -Dm644 io.github.crhy.voice2textai.desktop /app/share/applications/io.github.crhy.voice2textai.desktop
      - install -Dm644 io.github.crhy.voice2textai.metainfo.xml /app/share/metainfo/io.github.crhy.voice2textai.metainfo.xml
      - install -Dm644 icons/io.github.crhy.voice2textai.png /app/share/icons/hicolor/256x256/apps/io.github.crhy.voice2textai.png
